<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a class · Tramado</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --paper: #f3f5f8; --ink: #1b1f27; --ink-3: #5b6474; --accent: #2f4fd6; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --paper: #14171d; --ink: #e8ebf1; --ink-3: #a3abba; --accent: #a3b6ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 480px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: var(--ink-3); margin: 0 0 12px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <!-- PLACEHOLDER (M0) → UI-GROUP builds the join page (sync spec §7.2): it reads the invite from the URL
         fragment (never sent to a server) and hands it to the installed app. -->
    <h1>Join a class in Tramado</h1>
    <p>Open this invite in the Tramado app on your computer: choose “Join a class” and paste the link.</p>
    <p>Don’t have Tramado yet? It isn’t released yet.</p>
  </main>
</body>
</html>
