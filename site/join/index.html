<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>Join a class · Tramado</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f4fd6'/%3E%3Cpath d='M6 8h12M6 12h12M6 16h12M9 5v14M15 5v14' stroke='%23fff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <!--
    The Tramado join page (sync spec §7.2, UX §3.12.2), https://feiteira.github.io/Tramado/join/: an invite link is
    {this page}#tri1_…. The code lives only in the URL fragment, which browsers never send to a server; this page reads
    it locally, shows which class it is for, and offers [Open in Tramado] (tramado://join/<code>, tramado://pair/ for a
    trp code; not on phones, where Tramado does not run) and [Copy code], with a link to the GitHub Releases page to get
    Tramado. Static: no third-party scripts, no network (the CSP above forbids it; the icon is inline so the browser
    fetches no favicon), no cookies, no storage. EN, PT-PT and ES from the browser's language.
  -->
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f3f5f8; --paper-raised: #ffffff; --paper-sunk: #e8ecf2; --rule: #dce1e9;
      --ink: #181d29; --ink-2: #434a5b; --ink-3: #545b6c;
      --accent: #2f4fd6; --accent-hover: #2440b8; --accent-ink: #ffffff; --accent-soft: #e6ebff; --focus: #3d5cf0;
      --danger-text: #a3271e; --success-text: #1f6a3f; --c: #2f4fd6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #14171d; --paper-raised: #1c2028; --paper-sunk: #101318; --rule: #2b303b;
        --ink: #e8ebf1; --ink-2: #c3c8d2; --ink-3: #a1a8b5;
        --accent: #8ea5ff; --accent-hover: #a8baff; --accent-ink: #0f1430; --accent-soft: #232b48; --focus: #8ea5ff;
        --danger-text: #f59a90; --success-text: #86d2a2;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--paper); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%; max-width: 480px; padding: 24px; border: 1px solid var(--rule); border-radius: 14px;
      background: var(--paper-raised); box-shadow: 0 2px 4px rgba(20, 30, 60, .06), 0 10px 28px rgba(20, 30, 60, .12);
    }
    .brand { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; font-weight: 700; letter-spacing: -.01em; }
    .brand svg { flex: none; }
    h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.2; letter-spacing: -.01em; }
    p { margin: 0 0 12px; color: var(--ink-2); }
    .muted { color: var(--ink-3); font-size: 14px; }
    .class {
      display: flex; align-items: center; gap: 12px; margin: 12px 0 16px; padding: 12px;
      border: 1px solid var(--rule); border-left: 4px solid var(--c); border-radius: 9px;
      background: var(--paper-raised); background: color-mix(in oklab, var(--c) 12%, var(--paper-raised));
    }
    .class__mark { width: 36px; height: 36px; flex: none; border-radius: 8px; background: var(--c); }
    .class__name { font-size: 19px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
    .class__meta { color: var(--ink-2); font-size: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 12px; }
    button, .button {
      display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 16px;
      border: 1px solid var(--rule); border-radius: 9px; background: var(--paper-raised); color: var(--ink);
      font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
    }
    .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .primary:hover { background: var(--accent-hover); }
    button:focus-visible, .button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    textarea {
      width: 100%; min-height: 96px; padding: 8px; border: 1px solid var(--rule); border-radius: 9px; resize: vertical;
      background: var(--paper-sunk); color: var(--ink); font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
      overflow-wrap: anywhere; word-break: break-all;
    }
    label { display: block; margin: 0 0 4px; color: var(--ink-2); font-size: 14px; font-weight: 600; }
    ol { margin: 0 0 12px; padding-inline-start: 1.3em; color: var(--ink-2); }
    #status { min-height: 1.5em; color: var(--success-text); font-size: 14px; }
    #privacy { margin-top: 8px; }
    a { color: var(--accent); text-underline-offset: 2px; }
    a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
    .get { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--rule); }
    .get a { font-weight: 600; white-space: nowrap; }
    .error { color: var(--danger-text); }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: no-preference) { button, .button { transition: background-color .16s; } }
  </style>
</head>
<body>
  <main data-testid="join-page">
    <div class="brand" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#2f4fd6"/><path d="M6 8h12M6 12h12M6 16h12M9 5v14M15 5v14" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Tramado</span>
    </div>

    <section id="ok" hidden>
      <h1 id="title"></h1>
      <p id="invited"></p>
      <div class="class" id="class">
        <span class="class__mark" aria-hidden="true"></span>
        <div><div class="class__name" id="className"></div><div class="class__meta" id="classMeta"></div></div>
      </div>
      <ol>
        <li id="step1"></li>
        <li id="step2"></li>
      </ol>
      <div class="actions">
        <a class="button primary" id="open" data-testid="join-page-open"></a>
        <button type="button" id="copy" data-testid="join-page-copy"></button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <label for="code" id="codeLabel"></label>
      <textarea id="code" readonly spellcheck="false" data-testid="join-page-code"></textarea>
      <p class="muted" id="privacy"></p>
    </section>

    <section id="none" hidden>
      <h1 id="noneTitle"></h1>
      <p id="noneBody"></p>
    </section>

    <noscript><p>This page needs JavaScript to show the invite. You can also copy this whole link and paste it in Tramado → Join a class.</p></noscript>

    <p class="muted get"><span id="getNote">Don’t have Tramado yet? It is free and open source, for Windows, macOS and Linux.</span>
      <a id="get" data-testid="join-page-get" href="https://github.com/feiteira/Tramado/releases" target="_blank" rel="noopener noreferrer">Get Tramado</a></p>
  </main>

  <script>
    (function () {
      'use strict';
      var T = {
        en: {
          title: 'Join a class in Tramado', invited: '{name} invited you to', unknown: 'A classmate',
          step1: 'On your computer, open Tramado and choose “Join a class”.',
          step2: 'Paste the code below. On a phone, copy it and send it to your computer.',
          open: 'Open in Tramado', copy: 'Copy code', copied: 'Code copied. Paste it in Tramado → Join a class.',
          copyFailed: 'Select the code below and copy it.', code: 'Invite code',
          privacy: 'This page sends nothing. The invite code stays on your device: browsers never send the part of a link after “#”, so GitHub, which hosts this page, never sees it.',
          getNote: 'Don’t have Tramado yet? It is free and open source, for Windows, macOS and Linux.', get: 'Get Tramado',
          noneTitle: 'This link has no invite', noneBody: 'Ask your classmate to send the whole invite again: open Tramado → Members → Invite classmates → Copy invite.',
          pair: 'This is a code to add another computer. It needs a newer Tramado.'
        },
        pt: {
          title: 'Entrar numa disciplina no Tramado', invited: '{name} convidou-o para', unknown: 'Um colega',
          step1: 'No seu computador, abra o Tramado e escolha “Entrar numa disciplina”.',
          step2: 'Cole o código abaixo. Num telemóvel, copie-o e envie-o para o seu computador.',
          open: 'Abrir no Tramado', copy: 'Copiar o código', copied: 'Código copiado. Cole-o no Tramado → Entrar numa disciplina.',
          copyFailed: 'Selecione o código abaixo e copie-o.', code: 'Código do convite',
          privacy: 'Esta página não envia nada. O código do convite fica no seu dispositivo: os navegadores nunca enviam a parte de uma ligação depois de “#”, por isso o GitHub, que aloja esta página, nunca o vê.',
          getNote: 'Ainda não tem o Tramado? É gratuito e de código aberto, para Windows, macOS e Linux.', get: 'Transferir o Tramado',
          noneTitle: 'Esta ligação não tem convite', noneBody: 'Peça ao seu colega que volte a enviar o convite completo: abra o Tramado → Membros → Convidar colegas → Copiar o convite.',
          pair: 'Este é um código para adicionar outro computador. Precisa de um Tramado mais recente.'
        },
        es: {
          title: 'Unirse a una asignatura en Tramado', invited: '{name} le invitó a', unknown: 'Un compañero',
          step1: 'En su ordenador, abra Tramado y elija «Unirse a una asignatura».',
          step2: 'Pegue el código de abajo. En un móvil, cópielo y envíeselo a su ordenador.',
          open: 'Abrir en Tramado', copy: 'Copiar el código', copied: 'Código copiado. Péguelo en Tramado → Unirse a una asignatura.',
          copyFailed: 'Seleccione el código de abajo y cópielo.', code: 'Código de invitación',
          privacy: 'Esta página no envía nada. El código de invitación se queda en su dispositivo: los navegadores nunca envían la parte de un enlace que va después de «#», así que GitHub, que aloja esta página, nunca lo ve.',
          getNote: '¿Aún no tiene Tramado? Es gratuito y de código abierto, para Windows, macOS y Linux.', get: 'Descargar Tramado',
          noneTitle: 'Este enlace no tiene invitación', noneBody: 'Pida a su compañero que vuelva a enviar la invitación completa: abra Tramado → Miembros → Invitar a compañeros → Copiar la invitación.',
          pair: 'Este es un código para añadir otro ordenador. Necesita un Tramado más reciente.'
        }
      };
      var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']).map(function (l) { return String(l).toLowerCase(); });
      var lang = 'en';
      for (var i = 0; i < langs.length; i++) {
        var l = langs[i].slice(0, 2);
        if (l === 'pt' || l === 'es' || l === 'en') { lang = l; break; }
      }
      var t = T[lang];
      document.documentElement.lang = lang === 'pt' ? 'pt-PT' : lang;
      var $ = function (id) { return document.getElementById(id); };
      $('getNote').textContent = t.getNote;
      $('get').textContent = t.get;
      // Tramado runs on Windows, macOS and Linux only: on a phone or tablet a tramado:// link leads nowhere.
      var phone = (navigator.userAgentData && navigator.userAgentData.mobile === true) ||
        /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent || '');

      // The first tr[ip]<n>_ code of the fragment (sync spec §7.2 regex).
      var hash = '';
      try { hash = decodeURIComponent(location.hash.slice(1)); } catch (e) { hash = location.hash.slice(1); }
      var m = /\btr([ip])(\d+)_([A-Za-z0-9_-]{40,4096})/.exec(hash);
      if (!m) {
        $('noneTitle').textContent = t.noneTitle;
        $('noneBody').textContent = t.noneBody;
        $('none').hidden = false;
        document.title = t.noneTitle + ' · Tramado';
        return;
      }
      var code = m[0];
      var invite = null;
      if (m[1] === 'i') {
        try {
          var b64 = m[3].replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4) b64 += '=';
          var bin = atob(b64);
          var bytes = new Uint8Array(bin.length);
          for (var k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
          invite = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
        } catch (e) { invite = null; }
      }
      var str = function (v, max) { return typeof v === 'string' ? v.slice(0, max) : ''; };
      document.title = t.title + ' · Tramado';
      $('title').textContent = t.title;
      if (invite && typeof invite === 'object') {
        $('invited').textContent = t.invited.replace('{name}', str(invite.n, 64) || t.unknown);
        $('className').textContent = str(invite.l, 120);
        $('classMeta').textContent = [str(invite.lt, 80), str(invite.tm, 40)].filter(Boolean).join(' · ');
        if (typeof invite.c === 'string' && /^#[0-9a-fA-F]{6}$/.test(invite.c)) $('class').style.setProperty('--c', invite.c);
      } else {
        $('invited').textContent = m[1] === 'p' ? t.pair : '';
        $('class').hidden = true;
      }
      $('step1').textContent = t.step1;
      $('step2').textContent = t.step2;
      var open = $('open');
      open.textContent = t.open;
      open.href = 'tramado://' + (m[1] === 'p' ? 'pair/' : 'join/') + code;
      $('copy').textContent = t.copy;
      if (phone) {
        open.hidden = true;
        $('copy').className = 'primary';
      }
      $('codeLabel').textContent = t.code;
      $('privacy').textContent = t.privacy;
      var box = $('code');
      box.value = code;
      box.addEventListener('focus', function () { box.select(); });
      var status = $('status');
      $('copy').addEventListener('click', function () {
        var done = function () { status.className = ''; status.textContent = t.copied; };
        var fail = function () { status.className = 'error'; status.textContent = t.copyFailed; box.focus(); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, fail);
        else { box.focus(); try { document.execCommand('copy') ? done() : fail(); } catch (e) { fail(); } }
      });
      $('ok').hidden = false;
    })();
  </script>
</body>
</html>
